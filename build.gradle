plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.ezkiro'
version = '0.2.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

ext {
    springBootVersion = '4.1.1'
}

dependencies {
    // Spring Boot dependency management via BOM (no Spring Boot plugin needed for a library)
    api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    // AutoConfiguration support
    api 'org.springframework.boot:spring-boot-autoconfigure'

    // Servlet / Web APIs are provided by the host application
    compileOnly 'org.springframework.boot:spring-boot-starter-webmvc'

    // Jackson for JSON serialization / masking
    api 'tools.jackson.core:jackson-databind'

    // slf4j (provided transitively by spring-boot, kept explicit for clarity)
    compileOnly 'org.slf4j:slf4j-api'

    // Configuration metadata generation for application.yml auto-completion
    annotationProcessor platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testRuntimeOnly 'org.springframework.boot:spring-boot-restclient'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/ezkiro/access-log-plugin-for-java')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}
